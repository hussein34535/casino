org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768M -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx1G
android.useAndroidX=true
android.enableJetifier=true
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=2
# Compile Kotlin inside the Gradle daemon instead of spawning a separate
# Kotlin compile daemon (which was exhausting host memory and crashing).
kotlin.compiler.execution.strategy=in-process
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
