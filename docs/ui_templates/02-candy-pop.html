<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قالب 2 — كاندي بوب | Xo Game Show</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;700;800&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#FF3D8A; --pink-d:#C92468;
  --teal:#00C2A8; --teal-d:#008C7A;
  --sunny:#FFB100; --sunny-d:#C97F00;
  --violet:#7C3AED; --violet-d:#5B21B6;
  --ink:#2A1B3D; --surface:#FFFFFF;
  --page:#F3EEFF; --app:#FBF7FF;
  --muted:#6B5B85; --line:#EDE4FF;
  --pastel-pink:#FFE1EC; --pastel-teal:#D6F7F1; --pastel-sun:#FFF1CC; --pastel-vio:#EBE0FF;
  --s:.62;
  --font:"Baloo Bhaijaan 2","Cairo",system-ui,sans-serif; --display:"Baloo Bhaijaan 2","Cairo",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--page)}
body{font-family:var(--font);color:var(--ink);background:
  radial-gradient(340px 340px at 88% 6%, rgba(255,61,138,.18) 0%, transparent 70%),
  radial-gradient(380px 380px at 6% 22%, rgba(0,194,168,.16) 0%, transparent 70%),
  radial-gradient(300px 300px at 70% 96%, rgba(255,177,0,.14) 0%, transparent 70%),
  var(--page);
  min-height:100vh;padding:40px 24px 72px;position:relative;overflow-x:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none;z-index:0}
.blob.b1{width:340px;height:340px;background:#FF9CC4;top:-90px;right:-70px}
.blob.b2{width:300px;height:300px;background:#7FE8DA;bottom:8%;left:-90px}
a{color:inherit}
.page-head{max-width:1180px;margin:0 auto 40px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;position:relative;z-index:1}
.back{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--ink);text-decoration:none;border:2.5px solid var(--ink);background:var(--surface);padding:9px 16px;border-radius:999px;box-shadow:3px 3px 0 rgba(0,194,168,.55);transition:transform .15s ease-out,box-shadow .15s ease-out}
.back:hover{transform:translateY(1px);box-shadow:2px 2px 0 rgba(0,194,168,.55)}
.back:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.head-title{display:flex;align-items:center;gap:14px}
.num{font-family:var(--display);font-size:30px;color:var(--surface);background:var(--pink);width:54px;height:54px;border-radius:14px;display:grid;place-items:center;border:2.5px solid var(--ink);box-shadow:5px 5px 0 rgba(42,27,61,.85)}
.head-title h1{font-size:26px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.head-title p{font-size:14px;color:var(--muted);margin-top:2px;font-weight:600}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:999px;background:var(--pastel-teal);color:#046B5C;border:2px solid var(--ink)}
.tag.w{background:var(--pastel-sun);color:#8A5A00;border-color:var(--ink)}

.stage-row{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:34px;justify-content:center;align-items:flex-start;position:relative;z-index:1}
.phone{display:flex;flex-direction:column;gap:14px;align-items:center}
.phone .cap{font-size:14px;font-weight:700;color:var(--ink);display:flex;gap:8px;align-items:center}
.phone .cap i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:11.5px;border:2px solid var(--ink)}
.frame{position:relative;width:calc(390px * var(--s));height:calc(844px * var(--s));border-radius:calc(46px * var(--s));background:var(--ink);padding:calc(11px * var(--s));box-shadow:0 24px 60px rgba(42,27,61,.35), 6px 6px 0 rgba(255,61,138,.35)}
.screen{position:absolute;top:calc(11px * var(--s));right:calc(11px * var(--s));width:390px;height:844px;transform:scale(var(--s));transform-origin:top right;border-radius:36px;overflow:hidden;background:var(--app);color:var(--ink);display:flex;flex-direction:column}
.notch{position:absolute;top:calc(11px * var(--s));left:50%;transform:translateX(-50%);width:calc(112px * var(--s));height:calc(26px * var(--s));background:var(--ink);border-radius:0 0 16px 16px;z-index:9}

/* ---------- in-app shared ---------- */
.sb{display:flex;justify-content:space-between;align-items:center;padding:14px 26px 4px;font-size:13px;font-weight:700;color:var(--ink)}
.sb .r{display:flex;gap:6px;align-items:center;letter-spacing:1px}
.app{flex:1;display:flex;flex-direction:column;min-height:0}
.pad{padding:10px 18px 0}

.top{display:flex;align-items:center;gap:11px;margin-top:6px}
.ava{width:44px;height:44px;border-radius:50%;background:var(--pink);color:#fff;font-weight:800;font-size:18px;display:grid;place-items:center;border:2.5px solid var(--ink);box-shadow:3px 3px 0 rgba(124,58,237,.5)}
.hello{flex:1}
.hello b{display:block;font-size:17px;font-weight:800}
.hello span{font-size:12px;color:var(--muted);font-weight:600}
.chips{display:flex;gap:7px}
.chip{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;padding:7px 11px;border-radius:999px;background:var(--surface);border:2px solid var(--ink);box-shadow:2px 2px 0 rgba(255,177,0,.6)}
.chip.y{background:var(--pastel-sun);border-color:var(--ink);color:#8A5A00;box-shadow:2px 2px 0 rgba(255,177,0,.85)}

.banner{margin-top:14px;background:var(--teal);border-radius:16px;border:2.5px solid var(--ink);padding:16px;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden;box-shadow:6px 6px 0 rgba(255,61,138,.55)}
.banner::after{content:"";position:absolute;inset:auto -30px -46px auto;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.22)}
.banner .t{flex:1}
.banner b{font-size:15.5px;font-weight:800;display:block;color:#083B34}
.banner span{font-size:12px;color:#0B4F45;font-weight:600}
.banner .go{position:relative;z-index:1;background:var(--sunny);color:var(--ink);font-weight:800;font-size:13.5px;padding:10px 16px;border-radius:14px;border:2.5px solid var(--ink);font-family:var(--font);cursor:pointer;box-shadow:0 5px 0 var(--sunny-d);transition:transform .15s ease-out}
.banner .go:hover{transform:translateY(1px)}
.banner .go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sunny-d)}

.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}
.sec h2{font-size:16px;font-weight:800}
.sec .all{font-size:12.5px;font-weight:700;color:var(--violet)}

.mode-hero{background:var(--sunny);color:var(--ink);border-radius:16px;border:2.5px solid var(--ink);padding:16px;display:flex;align-items:center;gap:14px;box-shadow:6px 6px 0 rgba(255,61,138,.6)}
.mode-hero .ico{width:58px;height:58px;border-radius:14px;background:var(--surface);display:grid;place-items:center;font-size:30px;flex:none;border:2.5px solid var(--ink)}
.mode-hero .m{flex:1}
.mode-hero b{font-size:19px;font-weight:800;display:block}
.mode-hero span{font-size:12.5px;color:#6B4A00;font-weight:600}
.mode-hero .play{background:var(--ink);color:#fff;border:2.5px solid var(--ink);font-family:var(--font);font-weight:800;font-size:13px;padding:11px 15px;border-radius:14px;cursor:pointer;box-shadow:0 4px 0 rgba(42,27,61,.45);transition:transform .15s ease-out}
.mode-hero .play:hover{transform:translateY(1px)}
.modes3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:9px}
.mode{border:2.5px solid var(--ink);border-radius:14px;padding:12px 8px;text-align:center;color:var(--ink);box-shadow:4px 4px 0 rgba(124,58,237,.45)}
.mode:nth-child(1){background:var(--pastel-pink);box-shadow:4px 4px 0 rgba(255,61,138,.5)}
.mode:nth-child(2){background:var(--pastel-teal);box-shadow:4px 4px 0 rgba(0,194,168,.5)}
.mode:nth-child(3){background:var(--pastel-vio);box-shadow:4px 4px 0 rgba(124,58,237,.5)}
.mode .e{font-size:24px;display:block}
.mode b{display:block;font-size:13px;font-weight:800;margin-top:5px}
.mode span{font-size:10.5px;color:var(--muted);font-weight:600}

.rooms{display:flex;gap:9px}
.room{flex:1;background:var(--surface);border:2.5px solid var(--ink);border-radius:14px;padding:11px 12px;box-shadow:4px 4px 0 rgba(0,194,168,.45)}
.room b{font-size:13px;font-weight:800;display:block}
.room span{font-size:11px;color:var(--muted);font-weight:600}
.room .diff{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;margin-top:7px;background:var(--pastel-teal);color:#046B5C;border:2px solid var(--ink)}
.room .diff.mid{background:var(--pastel-sun);color:#8A5A00;border-color:var(--ink)}

.nav{margin-top:auto;display:grid;grid-template-columns:repeat(5,1fr);padding:10px 6px 22px;background:var(--surface);border-top:2.5px solid var(--ink)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:700}
.nav a.on{color:var(--pink)}
.nav a.on svg{stroke:var(--pink)}
.nav svg{width:21px;height:21px}

/* join screen */
.jhead{display:flex;align-items:center;gap:12px;padding:8px 18px 0}
.jhead .bk{width:38px;height:38px;border-radius:12px;background:var(--surface);border:2.5px solid var(--ink);display:grid;place-items:center;color:var(--ink);box-shadow:3px 3px 0 rgba(0,194,168,.55)}
.jhead h2{font-size:19px;font-weight:800}
.code-lbl{text-align:center;margin-top:26px;font-size:13.5px;color:var(--muted);font-weight:700}
.code{display:flex;gap:10px;justify-content:center;margin-top:12px;direction:ltr}
.code i{width:56px;height:66px;border-radius:14px;background:var(--surface);border:2.5px solid var(--ink);display:grid;place-items:center;font-style:normal;font-family:var(--display);font-size:32px;color:var(--ink);box-shadow:3px 3px 0 rgba(124,58,237,.45)}
.code i.f{background:var(--pink);color:#fff;border-color:var(--ink);box-shadow:3px 3px 0 rgba(42,27,61,.7)}
.code i.cur{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,58,237,.3)}
.btn{display:block;width:calc(100% - 36px);margin:22px auto 0;padding:16px;border-radius:14px;border:none;font-family:var(--font);font-size:16.5px;font-weight:800;cursor:pointer;transition:transform .15s ease-out}
.btn.pri{background:var(--pink);color:#fff;box-shadow:0 5px 0 var(--pink-d);border:2.5px solid var(--ink)}
.btn.pri:hover{transform:translateY(1px);box-shadow:0 4px 0 var(--pink-d)}
.btn.pri:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pink-d)}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12.5px;font-weight:700;margin:24px 18px}
.divider::before,.divider::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px}
.rlist{padding:0 18px;display:flex;flex-direction:column;gap:10px}
.rrow{display:flex;align-items:center;gap:11px;background:var(--surface);border:2.5px solid var(--ink);border-radius:14px;padding:12px;box-shadow:4px 4px 0 rgba(255,61,138,.4)}
.rrow .av{width:42px;height:42px;border-radius:12px;background:var(--pastel-teal);display:grid;place-items:center;font-size:20px;flex:none;border:2px solid var(--ink)}
.rrow .m{flex:1}
.rrow b{font-size:14px;font-weight:800;display:block}
.rrow span{font-size:11.5px;color:var(--muted);font-weight:600}
.rrow .jn{background:var(--sunny);color:var(--ink);border:2.5px solid var(--ink);font-family:var(--font);font-weight:800;font-size:12.5px;padding:9px 14px;border-radius:14px;cursor:pointer;box-shadow:0 4px 0 var(--sunny-d);transition:transform .15s ease-out}
.rrow .jn:hover{transform:translateY(1px)}

/* game screen */
.gtop{display:flex;align-items:center;gap:9px;padding:8px 18px 0}
.qbadge{font-family:var(--display);font-size:19px;background:var(--pink);color:#fff;padding:5px 14px;border-radius:999px;border:2.5px solid var(--ink);box-shadow:3px 3px 0 rgba(42,27,61,.75);font-weight:800}
.tchip{display:flex;align-items:center;gap:5px;font-weight:800;font-size:13.5px;background:var(--surface);border:2.5px solid var(--ink);padding:7px 12px;border-radius:999px;box-shadow:2px 2px 0 rgba(124,58,237,.45)}
.catchip{margin-inline-start:auto;font-weight:800;font-size:13px;background:var(--pastel-sun);border:2.5px solid var(--ink);color:#8A5A00;padding:7px 13px;border-radius:999px;box-shadow:2px 2px 0 rgba(255,177,0,.7)}
.tbar{height:9px;background:#EFE6FF;border-radius:999px;margin:13px 18px 0;overflow:hidden;border:2px solid var(--ink)}
.tbar i{display:block;height:100%;width:58%;border-radius:999px;background:var(--teal)}
.qcard{margin:16px 18px 0;background:var(--surface);color:var(--ink);border-radius:16px;border:2.5px solid var(--ink);padding:22px 20px;box-shadow:6px 6px 0 rgba(255,177,0,.75);text-align:center}
.qcard .lbl{font-size:12px;font-weight:800;color:var(--violet);background:var(--pastel-vio);padding:6px 12px;border-radius:999px;display:inline-block;border:2px solid var(--ink)}
.qcard h3{font-size:21px;font-weight:800;line-height:1.55;margin-top:12px;text-wrap:balance}
.ansbox{margin:14px 18px 0;background:var(--pastel-teal);border:2.5px solid var(--teal);border-radius:14px;padding:14px 15px;display:flex;align-items:center;gap:11px;box-shadow:4px 4px 0 rgba(0,194,168,.45)}
.ansbox .ok{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#052E28;display:grid;place-items:center;font-weight:800;flex:none;border:2px solid var(--ink)}
.ansbox .m{flex:1}
.ansbox b{font-size:15.5px;font-weight:800;display:block;color:#046B5C}
.ansbox span{font-size:11.5px;color:#0B6B5C;font-weight:600}
.voice{margin:14px 18px 0;text-align:center;font-size:12.5px;color:var(--muted);font-weight:700}
.duel{margin:16px 18px 0;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.pcard{border-radius:14px;padding:12px;text-align:center;background:var(--surface);border:2.5px solid var(--ink);box-shadow:4px 4px 0 rgba(124,58,237,.45)}
.pcard b{display:block;font-size:14px;font-weight:800}
.pcard .sc{font-family:var(--display);font-size:30px;line-height:1.1}
.pcard.me{background:var(--pastel-sun);border-color:var(--teal);box-shadow:4px 4px 0 rgba(0,194,168,.55)}
.pcard.me .sc{color:#8A5A00}
.pcard.ai .sc{color:var(--violet)}
.vs{font-family:var(--display);color:var(--muted);font-size:17px;font-weight:800}

/* result screen */
.res{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px;position:relative;overflow:hidden;background:var(--app)}
.cf{position:absolute;pointer-events:none}
.cf.c1{top:88px;left:34px;width:16px;height:16px;border-radius:50%;background:var(--pink);border:2.5px solid var(--ink)}
.cf.c2{top:150px;right:38px;width:12px;height:12px;border-radius:50%;background:var(--teal);border:2.5px solid var(--ink)}
.cf.c3{top:246px;left:24px;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:16px solid var(--sunny);transform:rotate(-18deg)}
.cf.c4{top:320px;right:28px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:15px solid var(--violet);transform:rotate(24deg)}
.cf.c5{bottom:210px;left:44px;width:11px;height:11px;border-radius:50%;background:var(--violet);border:2px solid var(--ink)}
.cf.c6{bottom:170px;right:52px;width:13px;height:13px;border-radius:50%;background:var(--sunny);border:2.5px solid var(--ink)}
.trophy{position:relative;width:96px;height:96px;border-radius:50%;background:var(--sunny);display:grid;place-items:center;font-size:52px;border:3px solid var(--ink);box-shadow:0 0 0 8px rgba(255,61,138,.35), 6px 6px 0 rgba(42,27,61,.85)}
.res h2{position:relative;font-family:var(--display);font-size:40px;margin-top:24px;color:var(--ink);font-weight:800}
.res .sub{position:relative;font-size:14.5px;color:var(--muted);margin-top:6px;font-weight:700}
.score-line{position:relative;display:flex;align-items:center;gap:16px;margin-top:22px;font-family:var(--display);font-size:52px;font-weight:800}
.score-line .a{color:var(--pink)} .score-line .b{color:var(--violet)} .score-line .d{color:var(--muted);font-size:34px}
.stats{position:relative;display:flex;gap:8px;margin-top:24px}
.stat{background:var(--surface);border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;text-align:center;box-shadow:4px 4px 0 rgba(255,61,138,.4)}
.stat:nth-child(2){box-shadow:4px 4px 0 rgba(0,194,168,.45)}
.stat:nth-child(3){box-shadow:4px 4px 0 rgba(255,177,0,.55)}
.stat b{display:block;font-size:16px;font-weight:800}
.stat span{font-size:10.5px;color:var(--muted);font-weight:700}
.res .btn.pri{margin-top:26px;max-width:300px}
.res .btn.gh{background:var(--surface);color:var(--ink);border:2.5px solid var(--ink);max-width:300px;margin-top:10px;box-shadow:0 4px 0 rgba(0,194,168,.7)}
.res .btn.gh:hover{transform:translateY(1px);box-shadow:0 3px 0 rgba(0,194,168,.7)}

.foot{max-width:1180px;margin:56px auto 0;text-align:center;color:var(--muted);font-size:13px;position:relative;z-index:1}
.foot a{color:var(--violet);text-decoration:none;font-weight:700}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>

<main class="stage-row">

<!-- ========== SCREEN 1: HOME ========== -->
<figure class="phone">
  <div class="frame"><div class="notch"></div>
  <div class="screen">
    <div class="sb"><span>9:41</span><span class="r">●●● ⌁ ▮</span></div>
    <div class="app">
      <div class="pad">
        <div class="top">
