<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قالب 5 — ممفيس بوب | Xo Game Show</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700;900&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#FFC900; --blue:#2F6BFF; --red:#FF3B3B;
  --ink:#111111; --white:#FFFFFF; --grey:#EFEFEF;
  --muted:#4A4A4A;
  --s:.62;
  --font:"Rubik","Cairo",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--white)}
body{font-family:var(--font);color:var(--ink);background:var(--white);position:relative;min-height:100vh;padding:40px 24px 72px;overflow-x:hidden}
a{color:inherit}

/* ---- memphis page background (clean geometric shapes) ---- */
.shapes{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.sh{position:absolute;display:block}
.circ{border-radius:50%}
.circ.y{background:var(--yellow)}
.circ.b{background:var(--blue)}
.circ.r{background:var(--red)}
.ring{border-radius:50%;background:transparent}
.ring.b{border:7px solid var(--blue)}
.ring.k{border:6px solid var(--ink)}
.tri{width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent}
.tri.y{border-bottom:34px solid var(--yellow)}
.tri.r{border-bottom:34px solid var(--red)}
.tri.b{border-bottom:34px solid var(--blue)}
.sq{border:4px solid var(--ink)}
.sq.y{background:var(--yellow);border-color:var(--ink)}
.dotgrid{width:96px;height:96px;background-image:radial-gradient(var(--ink) 2px,transparent 2px);background-size:14px 14px;opacity:.45}
.zig{line-height:0}

.page-head,.stage-row,.foot{position:relative;z-index:1}
.page-head{max-width:1180px;margin:0 auto 40px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.back{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--ink);text-decoration:none;background:var(--white);border:2.5px solid var(--ink);padding:9px 16px;border-radius:999px;transition:background .15s ease-out}
.back:hover{background:var(--yellow)}
.back:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.head-title{display:flex;align-items:center;gap:14px}
.num{font-family:var(--font);font-weight:900;font-size:30px;color:var(--ink);background:var(--yellow);width:54px;height:54px;border-radius:14px;border:3px solid var(--ink);display:grid;place-items:center;box-shadow:4px 4px 0 var(--ink);flex:none}
.head-title h1{font-size:26px;font-weight:900;letter-spacing:-.01em;text-wrap:balance}
.head-title p{font-size:14px;color:var(--muted);margin-top:2px;font-weight:700}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:999px;background:var(--white);color:var(--ink);border:2px solid var(--ink)}
.tag.w{background:var(--yellow);color:var(--ink)}

.stage-row{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:34px;justify-content:center;align-items:flex-start}
.phone{display:flex;flex-direction:column;gap:14px;align-items:center}
.phone .cap{font-size:14px;font-weight:700;color:var(--ink);display:flex;gap:8px;align-items:center}
.phone .cap i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--yellow);border:2px solid var(--ink);display:grid;place-items:center;font-size:11.5px;font-weight:900}
.frame{position:relative;width:calc(390px * var(--s));height:calc(844px * var(--s));border-radius:calc(46px * var(--s));background:var(--ink);padding:calc(11px * var(--s));box-shadow:10px 10px 0 var(--yellow)}
.screen{position:absolute;top:calc(11px * var(--s));right:calc(11px * var(--s));width:390px;height:844px;transform:scale(var(--s));transform-origin:top right;border-radius:36px;overflow:hidden;background-color:var(--white);background-image:radial-gradient(rgba(17,17,17,.13) 1.6px,transparent 1.6px);background-size:15px 15px;color:var(--ink);display:flex;flex-direction:column}
.notch{position:absolute;top:calc(11px * var(--s));left:50%;transform:translateX(-50%);width:calc(112px * var(--s));height:calc(26px * var(--s));background:var(--ink);border-radius:0 0 16px 16px;z-index:9}

/* ---------- in-app shared ---------- */
.sb{display:flex;justify-content:space-between;align-items:center;padding:14px 26px 4px;font-size:13px;font-weight:700;color:var(--ink)}
.sb .r{display:flex;gap:6px;align-items:center;letter-spacing:1px}
.app{flex:1;display:flex;flex-direction:column;min-height:0}
.pad{padding:10px 18px 0}

.top{display:flex;align-items:center;gap:11px;margin-top:6px}
.ava{width:44px;height:44px;border-radius:50%;background:var(--yellow);border:3px solid var(--ink);color:var(--ink);font-weight:900;font-size:18px;display:grid;place-items:center;flex:none}
.hello{flex:1}
.hello b{display:block;font-size:17px;font-weight:900}
.hello span{font-size:12px;color:var(--muted);font-weight:700}
.chips{display:flex;gap:7px}
.chip{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;padding:7px 11px;border-radius:999px;background:var(--white);border:2px solid var(--ink);color:var(--ink)}
.chip.y{background:var(--yellow);border-color:var(--ink)}

.banner{margin-top:14px;background:var(--blue);border-radius:14px;border:3px solid var(--ink);padding:16px;display:flex;align-items:center;gap:12px;position:relative;overflow:visible}
.banner::after{content:"";position:absolute;left:-18px;bottom:-24px;width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.18)}
.banner .t{flex:1;position:relative;z-index:1}
.banner b{font-size:15.5px;font-weight:900;display:block;color:var(--white)}
.banner span{font-size:12px;color:rgba(255,255,255,.88);font-weight:700}
.banner .go{position:relative;z-index:1;background:var(--yellow);color:var(--ink);font-weight:900;font-size:13.5px;padding:10px 16px;border-radius:12px;border:2.5px solid var(--ink);font-family:var(--font);cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:background .15s ease-out}
.banner .go:hover{background:var(--white)}
.sticker{position:absolute;z-index:2;background:var(--yellow);color:var(--ink);border:2.5px solid var(--ink);border-radius:10px;font-size:12px;font-weight:900;padding:5px 10px;box-shadow:3px 3px 0 var(--ink);transform:rotate(-3deg)}

.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}
.sec h2{font-size:16px;font-weight:900}
.sec .all{font-size:12.5px;font-weight:800;color:var(--blue)}

.mode-hero{background:var(--yellow);color:var(--ink);border-radius:14px;border:3px solid var(--ink);padding:16px;display:flex;align-items:center;gap:14px;position:relative}
.mode-hero .ico{width:58px;height:58px;border-radius:12px;background:var(--white);border:3px solid var(--ink);display:grid;place-items:center;font-size:28px;flex:none}
.mode-hero .m{flex:1}
.mode-hero b{font-size:19px;font-weight:900;display:block}
.mode-hero span{font-size:12.5px;color:var(--muted);font-weight:700}
.mode-hero .play{background:var(--ink);color:var(--white);border:none;font-family:var(--font);font-weight:800;font-size:13px;padding:11px 15px;border-radius:12px;cursor:pointer;transition:background .15s ease-out}
.mode-hero .play:hover{background:var(--blue)}
.modes3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:9px}
.mode{border-radius:14px;border:3px solid var(--ink);padding:12px 8px;text-align:center}
.mode.b{background:var(--blue);color:var(--white)}
.mode.r{background:var(--red);color:var(--white)}
.mode.w{background:var(--white);color:var(--ink)}
.mode .e{font-size:24px;display:block}
.mode b{display:block;font-size:13.5px;font-weight:900;margin-top:5px}
.mode span{font-size:10.5px;font-weight:700}
.mode.b span,.mode.r span{color:rgba(255,255,255,.9)}
.mode.w span{color:var(--muted)}

.rooms{display:flex;gap:9px}
.room{flex:1;background:var(--white);border:3px solid var(--ink);border-radius:14px;padding:11px 12px}
.room b{font-size:13px;font-weight:900;display:block}
.room span{font-size:11px;color:var(--muted);font-weight:700}
.room .diff{display:inline-block;font-size:10.5px;font-weight:900;padding:3px 8px;border-radius:999px;margin-top:7px;background:var(--yellow);color:var(--ink);border:2px solid var(--ink)}
.room .diff.mid{background:var(--blue);color:var(--white);border-color:var(--ink)}

.nav{margin-top:auto;display:grid;grid-template-columns:repeat(5,1fr);padding:10px 6px 22px;background:var(--white);border-top:3px solid var(--ink)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:700}
.nav a.on{color:var(--ink);font-weight:900}
.nav a.on::after{content:"";width:18px;height:5px;background:var(--yellow);border:1.5px solid var(--ink)}
.nav svg{width:21px;height:21px}

/* join screen */
.jhead{display:flex;align-items:center;gap:12px;padding:8px 18px 0}
.jhead .bk{width:38px;height:38px;border-radius:12px;background:var(--white);border:3px solid var(--ink);display:grid;place-items:center;color:var(--ink)}
.jhead h2{font-size:19px;font-weight:900}
.code-lbl{text-align:center;margin-top:26px;font-size:13.5px;color:var(--muted);font-weight:800}
.code{display:flex;gap:10px;justify-content:center;margin-top:12px;direction:ltr}
.code i{width:56px;height:66px;border-radius:14px;background:var(--white);border:3px solid var(--ink);display:grid;place-items:center;font-style:normal;font-family:var(--font);font-weight:900;font-size:32px;color:var(--ink)}
.code i.f{background:var(--yellow);color:var(--ink);border-color:var(--ink)}
.code i.cur{border-color:var(--blue);box-shadow:4px 4px 0 var(--blue)}
.btn{display:block;width:calc(100% - 36px);margin:22px auto 0;padding:16px;border-radius:12px;border:none;font-family:var(--font);font-size:16.5px;font-weight:900;cursor:pointer;transition:background .15s ease-out}
.btn.pri{background:var(--ink);color:var(--white);box-shadow:5px 5px 0 var(--yellow)}
.btn.pri:hover{background:var(--blue)}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12.5px;font-weight:800;margin:24px 18px}
.divider::before,.divider::after{content:"";flex:1;height:3px;background:var(--ink)}
.rlist{padding:0 18px;display:flex;flex-direction:column;gap:10px}
.rrow{display:flex;align-items:center;gap:11px;background:var(--white);border:3px solid var(--ink);border-radius:14px;padding:12px}
.rrow .av{width:42px;height:42px;border-radius:12px;background:var(--blue);border:2.5px solid var(--ink);display:grid;place-items:center;font-size:20px;flex:none}
.rrow .av.y{background:var(--yellow)}
.rrow .av.r{background:var(--red)}
.rrow .m{flex:1}
.rrow b{font-size:14px;font-weight:900;display:block}
.rrow span{font-size:11.5px;color:var(--muted);font-weight:700}
.rrow .jn{background:var(--yellow);color:var(--ink);border:2.5px solid var(--ink);font-family:var(--font);font-weight:900;font-size:12.5px;padding:9px 14px;border-radius:10px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:background .15s ease-out}
.rrow .jn:hover{background:var(--white)}

/* game screen */
.gtop{display:flex;align-items:center;gap:9px;padding:8px 18px 0}
.qbadge{font-family:var(--font);font-weight:900;font-size:18px;background:var(--red);color:var(--white);padding:6px 14px;border-radius:999px;border:2.5px solid var(--ink)}
.tchip{display:flex;align-items:center;gap:5px;font-weight:900;font-size:13.5px;background:var(--white);border:2.5px solid var(--ink);padding:7px 12px;border-radius:999px}
.catchip{margin-inline-start:auto;font-weight:900;font-size:13px;background:var(--yellow);border:2.5px solid var(--ink);color:var(--ink);padding:7px 13px;border-radius:999px}
.tbar{height:10px;background:var(--grey);border:2.5px solid var(--ink);border-radius:999px;margin:13px 18px 0;overflow:hidden}
.tbar i{display:block;height:100%;width:58%;background:var(--blue)}
.qcard{margin:16px 18px 0;background:var(--white);color:var(--ink);border-radius:14px;border:3px solid var(--ink);padding:22px 20px;box-shadow:6px 6px 0 var(--ink);text-align:center}
.qcard .lbl{font-size:12px;font-weight:900;color:var(--ink);background:var(--yellow);border:2px solid var(--ink);padding:6px 12px;border-radius:999px;display:inline-block}
.qcard h3{font-size:21px;font-weight:900;line-height:1.55;margin-top:12px;text-wrap:balance}
.ansbox{margin:14px 18px 0;background:var(--blue);border:3px solid var(--ink);border-radius:14px;padding:14px 15px;display:flex;align-items:center;gap:11px}
.ansbox .ok{width:34px;height:34px;border-radius:50%;background:var(--yellow);border:2.5px solid var(--ink);color:var(--ink);display:grid;place-items:center;font-weight:900;flex:none}
.ansbox .m{flex:1}
.ansbox b{font-size:15.5px;font-weight:900;display:block;color:var(--white)}
.ansbox span{font-size:11.5px;color:rgba(255,255,255,.9);font-weight:700}
.voice{margin:14px 18px 0;text-align:center;font-size:12.5px;color:var(--muted);font-weight:800}
.duel{margin:16px 18px 0;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.pcard{border-radius:14px;border:3px solid var(--ink);padding:12px;text-align:center}
.pcard b{display:block;font-size:14px;font-weight:900}
.pcard .sc{font-family:var(--font);font-weight:900;font-size:32px;line-height:1.1}
.pcard.me{background:var(--yellow);color:var(--ink)}
.pcard.ai{background:var(--blue);color:var(--white)}
.vs{font-family:var(--font);font-weight:900;color:var(--ink);font-size:17px}

/* result screen */
.res{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px;position:relative;overflow:hidden}
.conf{position:absolute;pointer-events:none}
.conf.tri-t{top:64px;right:34px;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:28px solid var(--red)}
.conf.cir{top:120px;left:36px;width:30px;height:30px;border-radius:50%;background:var(--blue)}
.conf.sq{bottom:150px;right:44px;width:24px;height:24px;background:var(--yellow);border:3px solid var(--ink);transform:rotate(12deg)}
.trophy{position:relative;width:96px;height:96px;border-radius:50%;background:var(--yellow);border:3px solid var(--ink);display:grid;place-items:center;font-size:52px}
.res h2{position:relative;display:inline-block;font-family:var(--font);font-weight:900;font-size:40px;margin-top:24px;color:var(--ink);background:var(--yellow);border:3px solid var(--ink);border-radius:14px;padding:8px 20px;box-shadow:5px 5px 0 var(--ink);transform:rotate(-2deg)}
.res .sub{position:relative;font-size:14.5px;color:var(--muted);margin-top:14px;font-weight:800}
.score-line{position:relative;display:flex;align-items:center;gap:14px;margin-top:22px;font-family:var(--font);font-weight:900;font-size:42px}
.score-line .a{background:var(--yellow);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:2px 18px}
.score-line .b{background:var(--blue);color:var(--white);border:3px solid var(--ink);border-radius:12px;padding:2px 18px}
.score-line .d{color:var(--ink);font-size:28px}
.stats{position:relative;display:flex;gap:8px;margin-top:24px}
.stat{border:3px solid var(--ink);border-radius:12px;padding:10px 12px;text-align:center}
.stat.b{background:var(--blue);color:var(--white)}
.stat.r{background:var(--red);color:var(--white)}
.stat.y{background:var(--yellow);color:var(--ink)}
.stat b{display:block;font-size:16px;font-weight:900}
.stat span{font-size:10.5px;font-weight:800}
.stat.b span,.stat.r span{color:rgba(255,255,255,.92)}
.stat.y span{color:var(--muted)}
.res .btn.pri{margin-top:26px;max-width:300px;background:var(--yellow);color:var(--ink);box-shadow:5px 5px 0 var(--ink)}
.res .btn.pri:hover{background:var(--white)}
.res .btn.gh{background:var(--white);color:var(--ink);border:3px solid var(--ink);max-width:300px;margin-top:10px;box-shadow:none}
.res .btn.gh:hover{background:var(--grey)}

.foot{max-width:1180px;margin:56px auto 0;text-align:center;color:var(--muted);font-size:13px;font-weight:700}
.foot a{color:var(--blue);text-decoration:none;font-weight:900}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>

<g id="i-user" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g>

<main class="stage-row">

<!-- ========== SCREEN 1: HOME ========== -->
<figure class="phone">
  <div class="frame"><div class="notch"></div>
  <div class="screen">
    <div class="sb"><span>9:41</span><span class="r">●●● ⌁ ▮</span></div>
    <div class="app">
      <div class="pad">
        <div class="top">
          <div class="ava">ح</div>
          <div class="hello"><b>أهلاً حسين 👋</b><span>جاهز لجولة جديدة؟</span></div>
          <div class="chips"><span class="chip y">🪙 1,250</span><span class="chip">🔥 7</span></div>
        </div>
