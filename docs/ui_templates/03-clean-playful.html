<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قالب ٣ — نظيف ومرح | Xo Game Show</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7F8; --ink:#101014; --surface:#FFFFFF;
  --grey1:#F0F0F3; --grey2:#E3E3E8;
  --accent:#2457FF; --coral:#FF5A3C; --success:#0FA958;
  --muted:#5C5C6B;
  --s:.62;
  --font:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --ease:150ms ease-out;
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg)}
body{font-family:var(--font);color:var(--ink);background:var(--bg);min-height:100vh;padding:40px 24px 72px}
a{color:inherit}
.page-head{max-width:1180px;margin:0 auto 40px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.back{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--ink);text-decoration:none;border:1.5px solid var(--ink);background:var(--surface);padding:9px 16px;border-radius:12px;transition:background var(--ease),color var(--ease)}
.back:hover{background:var(--ink);color:#fff}
.back:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.head-title{display:flex;align-items:center;gap:14px}
.num{font-size:26px;font-weight:700;color:#fff;background:var(--accent);width:54px;height:54px;border-radius:14px;display:grid;place-items:center}
.head-title h1{font-size:26px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.head-title p{font-size:14px;color:var(--muted);margin-top:2px}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:999px;background:var(--surface);color:var(--ink);border:1px solid var(--grey2)}
.tag.b{background:#EAF0FF;color:var(--accent);border-color:#C6D6FF}

.stage-row{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:34px;justify-content:center;align-items:flex-start}
.phone{display:flex;flex-direction:column;gap:14px;align-items:center}
.phone .cap{font-size:14px;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:center}
.phone .cap i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:11.5px}
.frame{position:relative;width:calc(390px * var(--s));height:calc(844px * var(--s));border-radius:calc(46px * var(--s));background:#000;padding:calc(11px * var(--s));box-shadow:0 24px 60px rgba(16,16,20,.22), 0 0 0 2px rgba(16,16,20,.08)}
.screen{position:absolute;top:calc(11px * var(--s));right:calc(11px * var(--s));width:390px;height:844px;transform:scale(var(--s));transform-origin:top right;border-radius:36px;overflow:hidden;background:var(--grey1);color:var(--ink);display:flex;flex-direction:column}
.notch{position:absolute;top:calc(11px * var(--s));left:50%;transform:translateX(-50%);width:calc(112px * var(--s));height:calc(26px * var(--s));background:#000;border-radius:0 0 16px 16px;z-index:9}

/* ---------- in-app shared ---------- */
.sb{display:flex;justify-content:space-between;align-items:center;padding:14px 26px 4px;font-size:13px;font-weight:700;color:var(--ink)}
.sb .r{display:flex;gap:6px;align-items:center;letter-spacing:1px}
.app{flex:1;display:flex;flex-direction:column;min-height:0}
.pad{padding:10px 18px 0}

.top{display:flex;align-items:center;gap:11px;margin-top:6px}
.ava{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:18px;display:grid;place-items:center;flex:none}
.hello{flex:1}
.hello b{display:block;font-size:17px;font-weight:700}
.hello span{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:7px}
.chip{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:7px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--grey2)}
.chip.y{background:#FFF1EE;border-color:#FFC9BD;color:#C43A20}

.banner{margin-top:14px;background:var(--accent);border-radius:14px;padding:16px;display:flex;align-items:center;gap:12px;color:#fff}
.banner .t{flex:1}
.banner b{font-size:15.5px;font-weight:700;display:block}
.banner span{font-size:12px;color:#D9E2FF}
.banner .go{background:#fff;color:var(--accent);font-weight:700;font-size:13.5px;padding:10px 16px;border-radius:12px;border:none;font-family:var(--font);cursor:pointer;transition:opacity var(--ease)}
.banner .go:hover{opacity:.88}

.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}
.sec h2{font-size:16px;font-weight:700}
.sec .all{font-size:12.5px;font-weight:600;color:var(--accent)}

.mode-hero{background:var(--surface);border:1px solid var(--grey2);border-radius:14px;padding:16px;display:flex;align-items:center;gap:14px}
.mode-hero .ico{width:58px;height:58px;border-radius:12px;background:#EAF0FF;display:grid;place-items:center;font-size:30px;flex:none}
.mode-hero .m{flex:1}
.mode-hero b{font-size:19px;font-weight:700;display:block}
.mode-hero span{font-size:12.5px;color:var(--muted)}
.mode-hero .play{background:var(--accent);color:#fff;border:none;font-family:var(--font);font-weight:700;font-size:13px;padding:11px 16px;border-radius:12px;cursor:pointer;transition:opacity var(--ease)}
.mode-hero .play:hover{opacity:.9}
.modes3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:9px}
.mode{background:var(--surface);border:1px solid var(--grey2);border-radius:12px;padding:12px 8px;text-align:center;transition:border-color var(--ease)}
.mode:hover{border-color:var(--accent)}
.mode .e{font-size:24px;display:block}
.mode b{display:block;font-size:13px;font-weight:700;margin-top:5px}
.mode span{font-size:10.5px;color:var(--muted)}

.rooms{display:flex;gap:9px}
.room{flex:1;background:var(--surface);border:1px solid var(--grey2);border-radius:12px;padding:11px 12px}
.room b{font-size:13px;font-weight:700;display:block}
.room span{font-size:11px;color:var(--muted)}
.room .diff{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;margin-top:7px;background:#EAF0FF;color:var(--accent)}
.room .diff.mid{background:#FFF1EE;color:#C43A20}

.nav{margin-top:auto;display:grid;grid-template-columns:repeat(5,1fr);padding:10px 6px 22px;background:var(--surface);border-top:1px solid var(--grey2)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:600;transition:color var(--ease)}
.nav a.on{color:var(--accent)}
.nav svg{width:21px;height:21px}

/* join screen */
.jhead{display:flex;align-items:center;gap:12px;padding:8px 18px 0}
.jhead .bk{width:38px;height:38px;border-radius:12px;background:var(--surface);border:1px solid var(--grey2);display:grid;place-items:center;color:var(--ink)}
.jhead h2{font-size:19px;font-weight:700}
.code-lbl{text-align:center;margin-top:26px;font-size:13.5px;color:var(--muted);font-weight:600}
.code{display:flex;gap:10px;justify-content:center;margin-top:12px;direction:ltr}
.code i{width:56px;height:66px;border-radius:12px;background:var(--surface);border:1.5px solid var(--grey2);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:32px;color:var(--ink)}
.code i.f{background:var(--ink);color:#fff;border-color:var(--ink)}
.code i.cur{border-color:var(--accent);box-shadow:0 0 0 3px rgba(36,87,255,.18)}
.btn{display:block;width:calc(100% - 36px);margin:22px auto 0;padding:16px;border-radius:12px;border:none;font-family:var(--font);font-size:16.5px;font-weight:700;cursor:pointer;transition:opacity var(--ease)}
.btn.pri{background:var(--accent);color:#fff}
.btn.pri:hover{opacity:.9}
.btn.sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--ink);margin-top:10px}
.btn.sec:hover{background:var(--grey1)}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12.5px;font-weight:600;margin:24px 18px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--grey2)}
.rlist{padding:0 18px;display:flex;flex-direction:column;gap:10px}
.rrow{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--grey2);border-radius:12px;padding:12px}
.rrow .av{width:42px;height:42px;border-radius:50%;background:var(--grey1);display:grid;place-items:center;font-size:20px;flex:none}
.rrow .m{flex:1}
.rrow b{font-size:14px;font-weight:700;display:block}
.rrow span{font-size:11.5px;color:var(--muted)}
.rrow .jn{background:var(--surface);color:var(--ink);border:1.5px solid var(--ink);font-family:var(--font);font-weight:700;font-size:12.5px;padding:9px 14px;border-radius:10px;cursor:pointer;transition:background var(--ease),color var(--ease)}
.rrow .jn:hover{background:var(--ink);color:#fff}

/* game screen */
.gtop{display:flex;align-items:center;gap:9px;padding:8px 18px 0}
.qbadge{font-size:15px;font-weight:700;background:var(--coral);color:#fff;padding:6px 14px;border-radius:999px}
.tchip{display:flex;align-items:center;gap:5px;font-weight:700;font-size:13.5px;background:var(--surface);border:1px solid var(--grey2);padding:7px 12px;border-radius:999px}
.catchip{margin-inline-start:auto;font-weight:700;font-size:13px;background:#EAF0FF;color:var(--accent);padding:7px 13px;border-radius:999px}
.tbar{height:9px;background:var(--grey2);border-radius:999px;margin:13px 18px 0;overflow:hidden}
.tbar i{display:block;height:100%;width:58%;border-radius:999px;background:var(--accent)}
.qcard{margin:16px 18px 0;background:var(--surface);border:1px solid var(--grey2);border-radius:14px;padding:22px 20px;text-align:center}
.qcard .lbl{font-size:12px;font-weight:700;color:var(--muted);background:var(--grey1);padding:6px 12px;border-radius:999px;display:inline-block}
.qcard h3{font-size:21px;font-weight:700;line-height:1.55;margin-top:12px;text-wrap:balance}
.ansbox{margin:14px 18px 0;background:#E8F7EE;border:1.5px solid var(--success);border-radius:12px;padding:14px 15px;display:flex;align-items:center;gap:11px}
.ansbox .ok{width:34px;height:34px;border-radius:50%;background:var(--success);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.ansbox .m{flex:1}
.ansbox b{font-size:15.5px;font-weight:700;display:block;color:#0A6B38}
.ansbox span{font-size:11.5px;color:#2C7A4F}
.voice{margin:14px 18px 0;text-align:center;font-size:12.5px;color:var(--muted);font-weight:600}
.duel{margin:16px 18px 0;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.pcard{border-radius:12px;padding:12px;text-align:center;background:var(--surface);border:1px solid var(--grey2)}
.pcard b{display:block;font-size:14px;font-weight:700}
.pcard .sc{font-size:32px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.pcard.me{border:1.5px solid var(--accent)}
.pcard.me .sc{color:var(--accent)}
.pcard.ai .sc{color:var(--ink)}
.vs{color:var(--muted);font-size:15px;font-weight:700}

/* result screen */
.res{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px;position:relative;overflow:hidden}
.blob{position:absolute;top:64px;width:220px;height:220px;border-radius:50%;background:var(--grey2);opacity:.55}
.trophy{position:relative;width:96px;height:96px;border-radius:50%;background:var(--surface);border:1.5px solid var(--grey2);display:grid;place-items:center;font-size:52px}
.res h2{position:relative;font-size:36px;font-weight:700;margin-top:24px;letter-spacing:-.02em}
.res .sub{position:relative;font-size:14.5px;color:var(--muted);margin-top:6px;font-weight:600}
.winchip{position:relative;display:inline-flex;align-items:center;gap:6px;margin-top:14px;background:var(--success);color:#fff;font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px}
.score-line{position:relative;display:flex;align-items:center;gap:16px;margin-top:18px;font-size:58px;font-weight:700;letter-spacing:-.03em;line-height:1}
.score-line .a{color:var(--accent)} .score-line .b{color:var(--ink)} .score-line .d{color:var(--muted);font-size:34px}
.stats{position:relative;display:flex;gap:8px;margin-top:24px}
.stat{background:var(--surface);border:1px solid var(--grey2);border-radius:12px;padding:10px 12px;text-align:center}
.stat b{display:block;font-size:16px;font-weight:700}
.stat span{font-size:10.5px;color:var(--muted);font-weight:600}
.res .btn.pri{margin-top:26px;max-width:300px}
.res .btn.sec{max-width:300px}

.foot{max-width:1180px;margin:56px auto 0;text-align:center;color:var(--muted);font-size:13px}
.foot a{color:var(--accent);text-decoration:none;font-weight:700}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>

  <div class="frame"><div class="notch"></div>
  <div class="screen">
    <div class="sb"><span>9:41</span><span class="r">●●● ⌁ ▮</span></div>
    <div class="app">
      <div class="gtop">
        <span class="qbadge">Q: 3 / 10</span>
