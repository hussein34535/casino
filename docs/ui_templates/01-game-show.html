<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قالب 1 — مسرح اللعبة | Xo Game Show</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{
  --stage:#161046; --stage2:#241A6B; --ink:#14123A;
  --yellow:#FFD60A; --red:#FF2E4C; --cyan:#3BE0FF; --blue:#2E6BFF;
  --card:#FFFFFF; --muted:#6A67A6; --line:#E7E5F7;
  --s:.62;
  --font:"Cairo",system-ui,sans-serif; --display:"Lalezar","Cairo",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--stage)}
body{font-family:var(--font);color:#EDEBFF;background:
  radial-gradient(900px 480px at 82% -8%, #3A2C96 0%, transparent 60%),
  radial-gradient(700px 420px at 8% 0%, #2A1E7A 0%, transparent 55%),
  var(--stage);
  min-height:100vh;padding:40px 24px 72px}
a{color:inherit}
.page-head{max-width:1180px;margin:0 auto 40px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.back{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:#EDEBFF;text-decoration:none;border:2px solid rgba(255,255,255,.25);padding:9px 16px;border-radius:999px;transition:background .15s ease-out,border-color .15s ease-out}
.back:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.5)}
.back:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.head-title{display:flex;align-items:center;gap:14px}
.num{font-family:var(--display);font-size:30px;color:var(--stage);background:var(--yellow);width:54px;height:54px;border-radius:14px;display:grid;place-items:center;box-shadow:0 6px 24px rgba(255,214,10,.35)}
.head-title h1{font-size:26px;font-weight:900;letter-spacing:-.01em;text-wrap:balance}
.head-title p{font-size:14px;color:#B9B4E8;margin-top:2px}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:999px;background:rgba(59,224,255,.14);color:var(--cyan);border:1.5px solid rgba(59,224,255,.4)}
.tag.w{background:rgba(255,214,10,.13);color:var(--yellow);border-color:rgba(255,214,10,.4)}

.stage-row{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:34px;justify-content:center;align-items:flex-start}
.phone{display:flex;flex-direction:column;gap:14px;align-items:center}
.phone .cap{font-size:14px;font-weight:700;color:#CFCBFF;display:flex;gap:8px;align-items:center}
.phone .cap i{font-style:normal;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:11.5px}
.frame{position:relative;width:calc(390px * var(--s));height:calc(844px * var(--s));border-radius:calc(46px * var(--s));background:#000;padding:calc(11px * var(--s));box-shadow:0 24px 60px rgba(0,0,0,.55), 0 0 0 2px rgba(255,255,255,.09)}
.screen{position:absolute;top:calc(11px * var(--s));right:calc(11px * var(--s));width:390px;height:844px;transform:scale(var(--s));transform-origin:top right;border-radius:36px;overflow:hidden;background:var(--stage2);color:#fff;display:flex;flex-direction:column}
.notch{position:absolute;top:calc(11px * var(--s));left:50%;transform:translateX(-50%);width:calc(112px * var(--s));height:calc(26px * var(--s));background:#000;border-radius:0 0 16px 16px;z-index:9}

/* ---------- in-app shared ---------- */
.sb{display:flex;justify-content:space-between;align-items:center;padding:14px 26px 4px;font-size:13px;font-weight:700;color:#EFEDFF}
.sb .r{display:flex;gap:6px;align-items:center;letter-spacing:1px}
.app{flex:1;display:flex;flex-direction:column;min-height:0}
.pad{padding:10px 18px 0}

.top{display:flex;align-items:center;gap:11px;margin-top:6px}
.ava{width:44px;height:44px;border-radius:50%;background:var(--yellow);color:#211A00;font-weight:900;font-size:18px;display:grid;place-items:center;box-shadow:0 0 0 3px rgba(255,214,10,.35)}
.hello{flex:1}
.hello b{display:block;font-size:17px;font-weight:900}
.hello span{font-size:12px;color:#B9B4E8}
.chips{display:flex;gap:7px}
.chip{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.18)}
.chip.y{background:rgba(255,214,10,.16);border-color:rgba(255,214,10,.5);color:var(--yellow)}

.banner{margin-top:14px;background:linear-gradient(120deg,#2E6BFF,#5A3BFF);border-radius:16px;padding:16px 16px;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden}
.banner::after{content:"";position:absolute;inset:auto -30px -46px auto;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.14)}
.banner .t{flex:1}
.banner b{font-size:15.5px;font-weight:900;display:block}
.banner span{font-size:12px;color:#DCE4FF}
.banner .go{position:relative;z-index:1;background:var(--yellow);color:#201800;font-weight:900;font-size:13.5px;padding:10px 16px;border-radius:12px;border:none;font-family:var(--font);cursor:pointer;box-shadow:0 4px 0 #B79300}

.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}
.sec h2{font-size:16px;font-weight:900}
.sec .all{font-size:12.5px;font-weight:700;color:var(--cyan)}

.mode-hero{background:var(--card);color:var(--ink);border-radius:16px;padding:16px;display:flex;align-items:center;gap:14px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.mode-hero .ico{width:58px;height:58px;border-radius:14px;background:var(--yellow);display:grid;place-items:center;font-size:30px;flex:none}
.mode-hero .m{flex:1}
.mode-hero b{font-size:19px;font-weight:900;display:block}
.mode-hero span{font-size:12.5px;color:var(--muted)}
.mode-hero .play{background:var(--ink);color:#fff;border:none;font-family:var(--font);font-weight:800;font-size:13px;padding:11px 15px;border-radius:11px;cursor:pointer}
.modes3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:9px}
.mode{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.16);border-radius:14px;padding:12px 8px;text-align:center;color:#fff}
.mode .e{font-size:24px;display:block}
.mode b{display:block;font-size:13px;font-weight:800;margin-top:5px}
.mode span{font-size:10.5px;color:#B9B4E8}

.rooms{display:flex;gap:9px}
.room{flex:1;background:rgba(255,255,255,.07);border:1.5px dashed rgba(255,255,255,.25);border-radius:14px;padding:11px 12px}
.room b{font-size:13px;font-weight:800;display:block}
.room span{font-size:11px;color:#B9B4E8}
.room .diff{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;margin-top:7px;background:rgba(59,224,255,.16);color:var(--cyan);border:1px solid rgba(59,224,255,.45)}
.room .diff.mid{background:rgba(255,214,10,.15);color:var(--yellow);border-color:rgba(255,214,10,.45)}

.nav{margin-top:auto;display:grid;grid-template-columns:repeat(5,1fr);padding:10px 6px 22px;background:rgba(10,7,40,.72);backdrop-filter:blur(8px);border-top:1.5px solid rgba(255,255,255,.12)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:#8F8AC4;font-size:10.5px;font-weight:700}
.nav a.on{color:var(--yellow)}
.nav svg{width:21px;height:21px}

/* join screen */
.jhead{display:flex;align-items:center;gap:12px;padding:8px 18px 0}
.jhead .bk{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);display:grid;place-items:center;color:#fff}
.jhead h2{font-size:19px;font-weight:900}
.code-lbl{text-align:center;margin-top:26px;font-size:13.5px;color:#B9B4E8;font-weight:700}
.code{display:flex;gap:10px;justify-content:center;margin-top:12px;direction:ltr}
.code i{width:56px;height:66px;border-radius:14px;background:rgba(255,255,255,.1);border:2.5px solid rgba(255,255,255,.28);display:grid;place-items:center;font-style:normal;font-family:var(--display);font-size:32px;color:#fff}
.code i.f{background:#fff;color:var(--ink);border-color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.code i.cur{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(59,224,255,.3)}
.btn{display:block;width:calc(100% - 36px);margin:22px auto 0;padding:16px;border-radius:14px;border:none;font-family:var(--font);font-size:16.5px;font-weight:900;cursor:pointer}
.btn.pri{background:var(--yellow);color:#201800;box-shadow:0 5px 0 #B79300}
.divider{display:flex;align-items:center;gap:12px;color:#8F8AC4;font-size:12.5px;font-weight:700;margin:24px 18px}
.divider::before,.divider::after{content:"";flex:1;height:1.5px;background:rgba(255,255,255,.16)}
.rlist{padding:0 18px;display:flex;flex-direction:column;gap:10px}
.rrow{display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.15);border-radius:14px;padding:12px}
.rrow .av{width:42px;height:42px;border-radius:12px;background:rgba(59,224,255,.15);display:grid;place-items:center;font-size:20px;flex:none}
.rrow .m{flex:1}
.rrow b{font-size:14px;font-weight:800;display:block}
.rrow span{font-size:11.5px;color:#B9B4E8}
.rrow .jn{background:#fff;color:var(--ink);border:none;font-family:var(--font);font-weight:900;font-size:12.5px;padding:9px 14px;border-radius:10px;cursor:pointer}

/* game screen */
.gtop{display:flex;align-items:center;gap:9px;padding:8px 18px 0}
.qbadge{font-family:var(--display);font-size:19px;background:var(--red);color:#fff;padding:5px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(255,46,76,.45)}
.tchip{display:flex;align-items:center;gap:5px;font-weight:800;font-size:13.5px;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.22);padding:7px 12px;border-radius:999px}
.catchip{margin-inline-start:auto;font-weight:800;font-size:13px;background:rgba(255,214,10,.15);border:1.5px solid rgba(255,214,10,.5);color:var(--yellow);padding:7px 13px;border-radius:999px}
.tbar{height:9px;background:rgba(255,255,255,.14);border-radius:999px;margin:13px 18px 0;overflow:hidden}
.tbar i{display:block;height:100%;width:58%;border-radius:999px;background:linear-gradient(90deg,var(--cyan),#2E6BFF)}
.qcard{margin:16px 18px 0;background:var(--card);color:var(--ink);border-radius:18px;padding:22px 20px;box-shadow:0 16px 40px rgba(0,0,0,.4);text-align:center}
.qcard .lbl{font-size:12px;font-weight:800;color:var(--muted);background:#F1EFFB;padding:6px 12px;border-radius:999px;display:inline-block}
.qcard h3{font-size:21px;font-weight:900;line-height:1.55;margin-top:12px;text-wrap:balance}
.ansbox{margin:14px 18px 0;background:rgba(0,210,106,.13);border:2.5px solid #00D26A;border-radius:14px;padding:14px 15px;display:flex;align-items:center;gap:11px}
.ansbox .ok{width:34px;height:34px;border-radius:50%;background:#00D26A;color:#00341B;display:grid;place-items:center;font-weight:900;flex:none}
.ansbox .m{flex:1}
.ansbox b{font-size:15.5px;font-weight:900;display:block;color:#BFFFE0}
.ansbox span{font-size:11.5px;color:#8CE8BC}
.voice{margin:14px 18px 0;text-align:center;font-size:12.5px;color:#B9B4E8;font-weight:700}
.duel{margin:16px 18px 0;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.pcard{border-radius:14px;padding:12px;text-align:center;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.18)}
.pcard b{display:block;font-size:14px;font-weight:900}
.pcard .sc{font-family:var(--display);font-size:30px;line-height:1.1}
.pcard.me{background:rgba(255,214,10,.14);border-color:rgba(255,214,10,.5)}
.pcard.me .sc{color:var(--yellow)}
.pcard.ai .sc{color:var(--cyan)}
.vs{font-family:var(--display);color:#8F8AC4;font-size:17px}

/* result screen */
.res{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px;position:relative;overflow:hidden}
.ray{position:absolute;top:-120px;width:420px;height:420px;background:conic-gradient(from 0deg, rgba(255,214,10,.22) 0 12deg, transparent 12deg 30deg, rgba(255,214,10,.22) 30deg 42deg, transparent 42deg 60deg, rgba(255,214,10,.22) 60deg 72deg, transparent 72deg 90deg, rgba(255,214,10,.22) 90deg 102deg, transparent 102deg 120deg, rgba(255,214,10,.22) 120deg 132deg, transparent 132deg 150deg, rgba(255,214,10,.22) 150deg 162deg, transparent 162deg 180deg, rgba(255,214,10,.22) 180deg 192deg, transparent 192deg 210deg, rgba(255,214,10,.22) 210deg 222deg, transparent 222deg 240deg, rgba(255,214,10,.22) 240deg 252deg, transparent 252deg 270deg, rgba(255,214,10,.22) 270deg 282deg, transparent 282deg 300deg, rgba(255,214,10,.22) 300deg 312deg, transparent 312deg 330deg, rgba(255,214,10,.22) 330deg 342deg, transparent 342deg 360deg);border-radius:50%;opacity:.5;animation:spin 26s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.trophy{position:relative;width:96px;height:96px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-size:52px;box-shadow:0 0 0 10px rgba(255,214,10,.25), 0 20px 50px rgba(0,0,0,.45)}
.res h2{position:relative;font-family:var(--display);font-size:44px;margin-top:24px;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.res .sub{position:relative;font-size:14.5px;color:#B9B4E8;margin-top:6px;font-weight:700}
.score-line{position:relative;display:flex;align-items:center;gap:16px;margin-top:22px;font-family:var(--display);font-size:52px}
.score-line .a{color:var(--yellow)} .score-line .b{color:var(--cyan)} .score-line .d{color:#6F6ABF;font-size:34px}
.stats{position:relative;display:flex;gap:8px;margin-top:24px}
.stat{background:rgba(255,255,255,.09);border:1.5px solid rgba(255,255,255,.2);border-radius:12px;padding:10px 12px;text-align:center}
.stat b{display:block;font-size:16px;font-weight:900}
.stat span{font-size:10.5px;color:#B9B4E8;font-weight:700}
.res .btn.pri{margin-top:26px;max-width:300px}
.res .btn.gh{background:transparent;color:#EFEDFF;border:2px solid rgba(255,255,255,.35);max-width:300px;margin-top:10px;box-shadow:none}

.foot{max-width:1180px;margin:56px auto 0;text-align:center;color:#8F8AC4;font-size:13px}
.foot a{color:var(--cyan);text-decoration:none;font-weight:700}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>

  <div class="head-title">
    <div class="num">١</div>

      <h1>مسرح اللعبة — Game Show Stage</h1>

  </div>
  <nav style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">

  </nav>
</header>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<g id="i-home" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V20a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></g>
<g id="i-trophy" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.6V17c0 .6-.5 1-1 1.2-1.2.5-2 2-2 3.8M14 14.6V17c0 .6.5 1 1 1.2 1.2.5 2 2 2 3.8M18 2H6v7a6 6 0 0 0 12 0V2Z"/></g>

<g id="i-user" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g>

</defs></svg>

<main class="stage-row">

<!-- ========== SCREEN 1: HOME ========== -->
<figure class="phone">
  <div class="frame"><div class="notch"></div>
  <div class="screen">
    <div class="sb"><span>9:41</span><span class="r">●●● ⌁ ▮</span></div>
    <div class="app">
      <div class="pad">
        <div class="top">
          <div class="ava">ح</div>
          <div class="hello"><b>أهلاً حسين 👋</b><span>جاهز لجولة جديدة؟</span></div>

        <div class="sec"><h2>🎯 اختار وضعك</h2><span class="all">الكل</span></div>

        <div class="mode-hero">
          <div class="ico">🎯</div>
          <div class="m"><b>تريفيا</b><span>٩١٤ سؤال محدَّث • ضد AI أو أصحابك</span></div>
          <button class="play">العب</button>
        </div>

        <div class="modes3">
          <div class="mode"><span class="e">🧩</span><b>ألغاز</b><span>١٦٩ لغز</span></div>
          <div class="mode"><span class="e">🎬</span><b>أفلام</b><span>٢١٧ سؤال</span></div>
          <div class="mode"><span class="e">✍️</span><b>كلمات</b><span>١٤٧٠ كلمة</span></div>
        </div>

        <div class="sec"><h2>🟢 غرف متاحة</h2><span class="all">عرض الكل</span></div>

          <div class="room"><b>بوت سهل 🤖</b><span>٢ من ٥ لاعبين</span><span class="diff">سهل</span></div>

      <nav class="nav">

        <a href="#"><svg><use href="#i-user"/></svg>حسابي</a>

    </div>
  </div></div>
  <figcaption class="cap"><i>1</i> الرئيسية</figcaption>
</figure>

<!-- ========== SCREEN 2: JOIN ========== -->
<figure class="phone">
  <div class="frame"><div class="notch"></div>
  <div class="screen">
    <div class="sb"><span>9:41</span><span class="r">●●● ⌁ ▮</span></div>
    <div class="app">
      <div class="jhead">
        <div class="bk"><svg width="18" height="18"><use href="#i-back"/></svg></div>
        <h2>انضم لغرفة 🚪</h2>
      </div>

      <div class="code-lbl">أدخل كود الغرفة</div>
      <div class="code">
        <i class="f">4</i><i class="f">8</i><i class="f">2</i><i class="f">1</i><i class="cur">_</i><i>_</i>
      </div>
      <button class="btn pri">انضم للغرفة</button>

      <div class="divider">أو اختار من الغرف المتاحة</div>

      <div class="rlist">
        <div class="rrow">
          <div class="av">🤖</div>
