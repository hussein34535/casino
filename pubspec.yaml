name: game_show_app
description: A full-scale online multiplayer game show application.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.0

  # Routing
  go_router: ^17.2.3

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0
  firebase_messaging: ^16.2.0
  firebase_analytics: ^12.3.0
  firebase_crashlytics: ^5.2.0
  firebase_performance: ^0.11.3
  cloud_functions: ^6.2.0

  # Authentication
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.3

  # Data
  shared_preferences: ^2.2.0
  json_annotation: ^4.8.0

  # Networking
  dio: ^5.3.0

  # Audio
  just_audio: ^0.10.5

  # UI
  cupertino_icons: ^1.0.6
  flutter_local_notifications: ^17.0.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.0
  lottie: ^3.3.3

  # Utilities
  rxdart: ^0.28.0
  intl: ^0.20.2
  path_provider: ^2.1.0
  connectivity_plus: ^7.1.1
  image_picker: ^1.0.0
  url_launcher: ^6.2.0
  share_plus: ^12.0.2
  package_info_plus: 9.0.1
  device_info_plus: ^12.4.0

  # Equatable
  equatable: ^2.0.5
  in_app_purchase: ^3.2.3
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  injectable_generator: ^2.4.0
  riverpod_generator: ^2.3.0
  hive_generator: ^2.0.0
  mockito: ^5.4.0
  mocktail: ^1.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    # NOTE: subdirectories are NOT bundled via the parent entry in this
    # Flutter version, so every asset subdir must be listed explicitly.
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
